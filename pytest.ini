[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: fast checks that must pass before anything else runs
    integration: requires a live service
    db: requires database access
    slow: long-running
    auth: authentication and token handling
    user_profile: user profile tests
    payments: payment flows
    subscriptions: subscription lifecycle
    oracle: verifies an effect in the database or cache, not just the response
    design: black-box test-design techniques applied to the demo service

addopts = -ra --strict-markers
